name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_beta_version:
        description: "UI patch beta version (for example 0.39.2-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing. Without it no OIDC token is minted and npm
  # falls back to looking for a credential, so a tokenless publish fails as unauthorised.
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Only the package being published. `bun run build` also built @gryt/docs, and on
      # 2026-08-17 a font decompressor dying there blocked a library release (GRYT-301).
      - run: bun run build:lib

      # Before the publish, because a version cannot be replaced once it is on npm.
      # @gryt/ui-native 0.1.0 went out unresolvable and the version had to be burned.
      - run: node scripts/check-installable.mjs packages/theme
      - run: node scripts/check-installable.mjs packages/owl
      - run: node scripts/check-installable.mjs packages/ui
      - run: node scripts/check-installable.mjs packages/ui-native
      - uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  ui-beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-ui-beta.mjs "$UI_BETA_VERSION"
        env:
          UI_BETA_VERSION: ${{ inputs.ui_beta_version }}
      - run: bun run typecheck && bun run test && bun run build:lib
      - run: node scripts/check-installable.mjs packages/ui
      - run: npm publish --tag beta
        working-directory: packages/ui
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

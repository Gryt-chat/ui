name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing. Without it the OIDC token is never
  # minted and npm falls back to looking for a credential, so a publish that
  # is meant to be tokenless fails as though the token were missing — which is
  # a confusing way to find out.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Only the package being published.
      #
      # This was `bun run build`, which is `bun --filter '*' build`, so it also
      # built @gryt/docs. On 2026-08-17 that blocked a release: @gryt/ui built
      # and exited 0, then the docs app died inside wawoff2, an emscripten
      # WOFF2 decompressor, on a refcount that read as undefined. A font
      # decompressor in a site nobody installs from npm stopped a library
      # release. GRYT-301.
      #
      # The docs build is not lost: ci.yml still runs `bun run build` across
      # every workspace on pull requests, so a genuine breakage there still
      # fails, just not on the publish path.
      - run: bun run build:lib

      # Before the publish rather than after it, because a version cannot be
      # replaced once it is on npm. @gryt/ui-native 0.1.0 went out with a
      # `workspace:*` dependency that npm refuses to resolve, and the only way
      # to fix it was to burn the version (GRYT-370).
      - run: node scripts/check-installable.mjs packages/ui
      - run: node scripts/check-installable.mjs packages/ui-native
      - uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

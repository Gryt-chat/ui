name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      # To push the regenerated registry back to the pull request branch.
      contents: write
      # To ask the API which files the pull request touches. An explicit
      # permissions block replaces the defaults rather than adding to them, so
      # without this line `gh api .../pulls/N/files` gets a 403.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch rather than the merge commit, so there is something to
          # push back to, and a token that is allowed to do it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # New here. Lint has never run in CI, so twelve errors accumulated on main
      # unseen — two files' worth of React Compiler findings in ui-native, fixed
      # or explained in the same change that added this step (GRYT-528).
      #
      # The warning ceiling is a ratchet, not a target. There are 108 today and
      # `--max-warnings 108` only fails when that grows, so the backlog cannot
      # get bigger while nobody is made to clear it first. Lower the number as
      # they go; the honest end state is 0.
      - run: bun run lint
      - run: bun run test
      # Check any drawing this pull request adds or changes, before anything
      # tries to build with it.
      #
      # This is the same checker `npx @gryt/owl check` ships, run from source,
      # and it exists so that adding a cosmetic fails here with a report about
      # the drawing rather than somewhere downstream with a stack trace. It
      # reports the filename's slot and rarity, the viewBox, whether the
      # transforms are flattened, how much of the bird it found, and any colour
      # with no palette role.
      #
      # The one that matters is how much of the bird it found. A drawing that
      # was not drawn on the base extracts perfectly happily and produces an
      # accessory shaped like a whole owl, so "it produced something" is not the
      # test.
      - name: Check drawings added by this pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The API rather than git. actions/checkout is shallow, so
          # `git merge-base HEAD origin/main` has no common ancestor to find and
          # exits non-zero — which under `bash -e` failed this step with no
          # output at all. Deepening the clone would work and costs a full
          # history on every run; the pull request already knows its own files.
          mapfile -t drawings < <(
            gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[] | select(.status != "removed") | .filename' \
              | grep -E '^packages/owl/artwork/.*\.svg$' || true
          )
          if [ ${#drawings[@]} -eq 0 ]; then
            echo "no drawings added or changed"
            exit 0
          fi
          printf 'checking %s drawing(s)\n\n' "${#drawings[@]}"
          cd packages/owl
          bun src/cli/check.ts check "${drawings[@]/#packages\/owl\//}"

      # Regenerate the registry from the drawings, and commit it if it moved.
      #
      # This used to be `accessories:check`, which failed the build when the
      # committed file disagreed with artwork/ and told you to run the script.
      # That is a chore with one correct answer, which is the kind of chore a
      # machine should be doing: adding a cosmetic is now dropping an SVG into
      # artwork/ and releasing.
      #
      # The file stays committed rather than generated at build time and
      # gitignored. Accessory output is load-bearing — the registry decides what
      # existing people look like — and a diff on this file is the only place
      # that change is visible before it ships. Generating it invisibly would
      # mean nobody ever sees which owls moved.
      #
      # Only on pull_request: a push to main has no branch to push back to, and
      # the merge commit already carries whatever the PR settled on. The check
      # below still runs everywhere, so main cannot drift.
      - name: Regenerate cosmetics from artwork/
        if: github.event_name == 'pull_request'
        run: bun --filter @gryt/owl accessories
      - name: Commit the regenerated registry
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- packages/owl/src/accessories.generated.ts packages/owl/artwork/keys.json; then
            echo "registry already matches the drawings"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/owl/src/accessories.generated.ts packages/owl/artwork/keys.json
          git commit -m "chore: regenerate cosmetics from artwork/ [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
      # Still runs, on every event. After the step above it should always pass
      # on a pull request; on main it is the thing that catches a registry that
      # disagrees with the drawings however it got that way.
      - run: bun --filter @gryt/owl accessories:check
      - run: bun run build
      - run: bunx publint packages/theme
      - run: bunx publint packages/owl
      - run: bunx publint packages/ui
      - run: bunx publint packages/ui-native
      # Both CSS entrypoints are excluded: attw checks that an entrypoint
      # resolves to type declarations or JavaScript, and a stylesheet is
      # neither. Any future CSS export needs adding here too.
      # No exclusions needed here: @gryt/theme has one entry point, ships no
      # CSS, and has both an ESM and a CommonJS build.
      - run: bunx @arethetypeswrong/cli --pack packages/theme
      - run: bunx @arethetypeswrong/cli --pack packages/owl
      - run: bunx @arethetypeswrong/cli --pack packages/ui --exclude-entrypoints ./styles.css --exclude-entrypoints ./theme.css

      # ui-native is ESM only and ships no CommonJS build, the same as
      # @gryt/voice, so the CJS-resolves-to-ESM rule is the intended shape here
      # rather than a finding. Everything else is on: this is the check that
      # caught the extensionless relative imports tsc emits, which resolved
      # under Metro and nowhere else (GRYT-356).
      - run: bunx @arethetypeswrong/cli --pack packages/ui-native --ignore-rules cjs-resolves-to-esm

      # Packs each package and installs the tarball into an empty directory,
      # which is the only check here that resolves the manifest the way a
      # consumer does. publint and attw both run against the workspace, where
      # `workspace:*` is a legitimate dependency spec, so both passed while
      # @gryt/ui-native 0.1.0 could not be installed at all (GRYT-370).
      - run: node scripts/check-installable.mjs packages/theme
      - run: node scripts/check-installable.mjs packages/owl
      - run: node scripts/check-installable.mjs packages/ui
      - run: node scripts/check-installable.mjs packages/ui-native

  # ui.gryt.chat is this Dockerfile, and nothing above builds it. The manifests
  # it copies are listed one at a time, so adding a workspace member without
  # adding it there breaks the image while every check here stays green — which
  # is what happened with ui-native, and it went unnoticed until a deploy tried
  # it (GRYT-362).
  #
  # No push and no run: the failure worth catching is a build failure, and the
  # build is the check.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain docker build rather than buildx with a layer cache. There is no
      # cache to reuse between pull requests on a Dockerfile whose first real
      # step installs the workspace, and a cold build here is a couple of
      # minutes.
      - run: docker build .

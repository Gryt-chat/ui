name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      # To push the regenerated registry back to the pull request branch.
      contents: write
      # To ask the API which files the PR touches. A permissions block replaces the
      # defaults rather than adding to them, so without this line the call 403s.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch rather than the merge commit, so there is something to
          # push back to, and a token that is allowed to do it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The warning ceiling is a ratchet, not a target: `--max-warnings 114` fails only
      # when the backlog grows. Lower it as they go; the honest end state is 0.
      - run: bun run lint
      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: bun run test:comment-length
      - run: bun run test
      # Only artwork/ itself: a subfolder holds another generator's drawings, which this
      # reports as slotless. A drawing not drawn on the base extracts as a whole owl.
      - name: Check drawings added by this pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The API rather than git: actions/checkout is shallow, so `git merge-base`
          # exits non-zero and under `bash -e` failed this step with no output.
          mapfile -t drawings < <(
            gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[] | select(.status != "removed") | .filename' \
              | grep -E '^packages/owl/artwork/[^/]+\.svg$' || true
          )
          if [ ${#drawings[@]} -eq 0 ]; then
            echo "no drawings added or changed"
            exit 0
          fi
          printf 'checking %s drawing(s)\n\n' "${#drawings[@]}"
          cd packages/owl
          bun src/cli/check.ts check "${drawings[@]/#packages\/owl\//}"

      # Regenerate the registry from the drawings and commit it if it moved. Committed
      # rather than built: a diff here is the only place a moved owl is visible.
      - name: Regenerate cosmetics from artwork/
        if: github.event_name == 'pull_request'
        run: bun --filter @gryt/owl accessories
      - name: Commit the regenerated registry
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- packages/owl/src/accessories.generated.ts packages/owl/artwork/keys.json; then
            echo "registry already matches the drawings"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/owl/src/accessories.generated.ts packages/owl/artwork/keys.json
          git commit -m "chore: regenerate cosmetics from artwork/ [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
      # Still runs on every event. On main it is what catches a registry that disagrees
      # with the drawings, however it got that way.
      - run: bun --filter @gryt/owl accessories:check
      # The eggs' own version. Theirs are not regenerated and pushed back, so this just
      # fails and says which command to run.
      - run: bun --filter @gryt/owl eggs:check
      - run: bun run build
      - run: bunx publint packages/theme
      - run: bunx publint packages/owl
      - run: bunx publint packages/ui
      - run: bunx publint packages/ui-native
      # Every CSS entrypoint is excluded: attw wants types or JavaScript, and a
      # stylesheet is neither. A future CSS export needs adding here too.
      - run: bunx @arethetypeswrong/cli --pack packages/theme
      - run: bunx @arethetypeswrong/cli --pack packages/owl
      - run: bunx @arethetypeswrong/cli --pack packages/ui --exclude-entrypoints ./styles.css --exclude-entrypoints ./theme.css --exclude-entrypoints ./components.css

      # ui-native is ESM only, so cjs-resolves-to-esm is the intended shape. The rest is
      # on: it caught the extensionless imports tsc emits, which only Metro resolved.
      - run: bunx @arethetypeswrong/cli --pack packages/ui-native --ignore-rules cjs-resolves-to-esm

      # Packs and installs each tarball into an empty directory — the only check that
      # resolves the manifest as a consumer does. `workspace:*` passed everything else.
      - run: node scripts/check-installable.mjs packages/theme
      - run: node scripts/check-installable.mjs packages/owl
      - run: node scripts/check-installable.mjs packages/ui
      - run: node scripts/check-installable.mjs packages/ui-native

  # ui.gryt.chat is this Dockerfile and nothing above builds it. Its manifests are listed
  # one at a time, so a new workspace member breaks the image with CI still green.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain docker build rather than buildx: there is no cache to reuse between PRs on
      # a Dockerfile whose first real step installs the workspace.
      - run: docker build .
